data:
  type: DIV2K
  norm: {'lr': {'sub': 0.5, 'div': 0.5}, 'gt': {'sub': 0.5, 'div': 0.5}}
  scale: 2
  patch_h: 128
  patch_w: 128
  seed: 42
  data_path: /root/autodl-tmp/DIV2K
loader:
  type: reproducible
  batch_size: 16
  num_workers: 16
  pin_memory: true
  val_batch_size: 1
model:
  type: EDSR_MSFNO
  Encoder:
    in_channel: 3
    out_channel: 16
    num_blocks: 16
    res_scale: 0.05
    global_res_scale: 0.1
    activation: gelu
  MSFNO:
    in_channel: 16
    out_channel: 3
    modes1: 32
    modes2: 32
    width: 16
    layers: 4
    scale: 2
    init_method: kaiming
    activation: gelu
    num_subnets: 4
    init_scales:
    - 1.0
    - 40.0
    - 80.0
    - 100.0

trainer:
  eval_metric_key: psnr
  device: cuda:0
  type: 1OputTrainer
  epochs: 400
  lr: 0.0005
  encoder_grad_clip: 10.0
  save_path: /root/autodl-tmp/checkpoints
  seed: 42
  # loss:
  #   high_freq_weight: 3.0
  #   low_freq_weight: 1.0
  #   low_freq_ratio: 0.3
  scheduler:
    warmup_epochs: 10
    # restart_lr_ratio: 0.3
    # restart_warmup: 10
    lr_min: 1.0e-05
  optimizer:
    type: adam
    weight_decay: 0.0

